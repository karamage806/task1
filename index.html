<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fluxify — Week 1 Frontend · React + Vite + Tailwind" />
    <meta name="theme-color" content="#0a0b0f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet" />
    <title>Fluxify — Week 1</title>
    <style>
      /* ── Global CSS Variables ── */
      :root {
        --color-bg:          #0a0b0f;
        --color-surface:     #111318;
        --color-surface-2:   #181b22;
        --color-border:      #252830;
        --color-border-2:    #2e3240;
        --color-accent:      #f5a623;
        --color-accent-dim:  #b87a15;
        --color-accent-glow: rgba(245,166,35,0.18);
        --color-teal:        #00d4aa;
        --color-teal-dim:    #009e7e;
        --color-teal-glow:   rgba(0,212,170,0.15);
        --color-danger:      #ff4d6d;
        --color-danger-dim:  #c0304d;
        --color-text:        #e8eaf0;
        --color-text-muted:  #7a8099;
        --color-text-faint:  #454a5e;
        --font-display: 'Fraunces', serif;
        --font-body:    'Outfit', sans-serif;
        --font-mono:    'Space Mono', monospace;
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 14px;
        --radius-xl: 20px;
        --shadow-sm:     0 1px 3px rgba(0,0,0,0.4);
        --shadow-md:     0 4px 16px rgba(0,0,0,0.5);
        --shadow-lg:     0 8px 32px rgba(0,0,0,0.6);
        --shadow-accent: 0 0 20px var(--color-accent-glow);
        --shadow-teal:   0 0 20px var(--color-teal-glow);
        --transition: 180ms cubic-bezier(0.4,0,0.2,1);
      }

      .light {
        --color-bg:          #f4f2ee;
        --color-surface:     #ffffff;
        --color-surface-2:   #f0ede8;
        --color-border:      #dedad4;
        --color-border-2:    #ccc8c0;
        --color-text:        #1a1c24;
        --color-text-muted:  #6b6f80;
        --color-text-faint:  #aeafc0;
        --color-accent-glow: rgba(245,166,35,0.12);
        --color-teal-glow:   rgba(0,212,170,0.10);
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }

      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        background-image:
          radial-gradient(ellipse 80% 50% at 20% -10%, rgba(245,166,35,0.06) 0%, transparent 60%),
          radial-gradient(ellipse 60% 40% at 80% 110%, rgba(0,212,170,0.05) 0%, transparent 60%);
      }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--color-surface); }
      ::-webkit-scrollbar-thumb { background: var(--color-border-2); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-accent-dim); }

      :focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }
      ::selection { background: var(--color-accent-glow); color: var(--color-accent); }

      /* Typography */
      .font-display { font-family: var(--font-display); }
      .font-mono    { font-family: var(--font-mono); }

      /* Animations */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 0 0 var(--color-accent-glow); }
        50%       { box-shadow: 0 0 0 8px transparent; }
      }
      .animate-fade-up { animation: fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) both; }
      .delay-1 { animation-delay: 60ms; }
      .delay-2 { animation-delay: 120ms; }
      .delay-3 { animation-delay: 180ms; }
      .delay-4 { animation-delay: 240ms; }

      /* Cards */
      .card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: 1.25rem 1.5rem;
        transition: border-color var(--transition), box-shadow var(--transition);
      }
      .card:hover { border-color: var(--color-border-2); box-shadow: var(--shadow-md); }
      .card-accent:hover { border-color: var(--color-accent-dim); box-shadow: var(--shadow-accent); }
      .card-teal:hover   { border-color: var(--color-teal-dim);   box-shadow: var(--shadow-teal); }

      /* Buttons */
      .btn {
        display: inline-flex; align-items: center; gap: 0.5rem;
        padding: 0.5rem 1.1rem; border-radius: var(--radius-md);
        font-family: var(--font-body); font-size: 0.875rem; font-weight: 600;
        cursor: pointer; transition: all var(--transition); border: none;
        text-decoration: none; white-space: nowrap;
      }
      .btn-primary { background: var(--color-accent); color: #0a0b0f; }
      .btn-primary:hover { background: #ffb93d; box-shadow: 0 4px 14px rgba(245,166,35,0.35); transform: translateY(-1px); }
      .btn-secondary { background: var(--color-surface-2); color: var(--color-text); border: 1px solid var(--color-border-2); }
      .btn-secondary:hover { border-color: var(--color-accent-dim); color: var(--color-accent); }
      .btn-ghost { background: transparent; color: var(--color-text-muted); border: 1px solid transparent; }
      .btn-ghost:hover { background: var(--color-surface-2); color: var(--color-text); border-color: var(--color-border); }
      .btn-danger { background: var(--color-danger); color: #fff; }
      .btn-danger:hover { background: var(--color-danger-dim); box-shadow: 0 4px 14px rgba(255,77,109,0.35); transform: translateY(-1px); }

      /* Inputs */
      .input {
        width: 100%; background: var(--color-surface-2);
        border: 1px solid var(--color-border); border-radius: var(--radius-md);
        padding: 0.55rem 0.875rem; color: var(--color-text);
        font-family: var(--font-body); font-size: 0.875rem;
        transition: border-color var(--transition), box-shadow var(--transition); outline: none;
      }
      .input::placeholder { color: var(--color-text-faint); }
      .input:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-glow); }
      .input.error { border-color: var(--color-danger); box-shadow: 0 0 0 3px rgba(255,77,109,0.12); }

      /* Badges */
      .badge {
        display: inline-flex; align-items: center; gap: 0.3rem;
        padding: 0.2rem 0.6rem; border-radius: 99px;
        font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      }
      .badge-accent  { background: var(--color-accent-glow); color: var(--color-accent); }
      .badge-teal    { background: var(--color-teal-glow);   color: var(--color-teal); }
      .badge-danger  { background: rgba(255,77,109,0.15);    color: var(--color-danger); }
      .badge-neutral { background: var(--color-surface-2);   color: var(--color-text-muted); border: 1px solid var(--color-border); }

      /* Misc */
      .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--color-border-2), transparent); margin: 1rem 0; }
      .avatar  { border-radius: 50%; object-fit: cover; border: 2px solid var(--color-border-2); transition: border-color var(--transition); }
      .avatar:hover { border-color: var(--color-accent); }
      .tag {
        display: inline-block; padding: 0.18rem 0.55rem;
        background: var(--color-surface-2); border: 1px solid var(--color-border);
        border-radius: var(--radius-sm); font-size: 0.72rem;
        color: var(--color-text-muted); font-family: var(--font-mono);
        transition: all var(--transition);
      }
      .tag:hover { border-color: var(--color-accent-dim); color: var(--color-accent); }
      .label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--color-text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.4rem; }
      .error-text { font-size: 0.78rem; color: var(--color-danger); margin-top: 0.3rem; }
      .section-heading { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--color-text); line-height: 1.2; }
      .section-heading span { color: var(--color-accent); }
      .stat-box { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 0.75rem 1rem; text-align: center; }
      .stat-value { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 700; color: var(--color-accent); }
      .stat-label { font-size: 0.72rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
      .accent-bar { display: inline-block; width: 32px; height: 3px; background: var(--color-accent); border-radius: 99px; margin-right: 0.5rem; vertical-align: middle; }
      .teal-bar   { display: inline-block; width: 32px; height: 3px; background: var(--color-teal);   border-radius: 99px; margin-right: 0.5rem; vertical-align: middle; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
